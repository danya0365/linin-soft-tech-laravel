name: Deploy to Linentechpro

on:
  push:
    branches:
      - linentechpro.livex.cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LLC_SSH_HOST }}
          username: ${{ secrets.LLC_SSH_USERNAME }}
          key: ${{ secrets.LLC_SSH_KEY }}
          port: ${{ secrets.LLC_SSH_PORT }}
          script: |
            # ล้มทันทีเมื่อ step ไหนพัง — ไม่งั้น deploy ที่ fail จะยังรายงานเขียว
            # (เคยเกิดจริงบน dev: git fetch/reset พังจาก dubious ownership แต่ workflow ขึ้นเขียว
            #  เพราะ echo บรรทัดสุดท้าย exit 0 → โค้ดบน server ค้างเก่าโดยไม่มีใครรู้)
            set -euo pipefail

            APP_DIR="/var/www/html/web"
            BRANCH="linentechpro.livex.cloud"
            PHP_PATH="/usr/bin/php8.5"
            COMPOSER_PATH="composer.phar"

            cd "$APP_DIR"

            # repo เป็นของ www-data แต่ deploy รันเป็น root → git ปฏิเสธถ้าไม่ whitelist ไว้
            git config --global --get-all safe.directory | grep -qx "$APP_DIR" \
              || git config --global --add safe.directory "$APP_DIR"

            # Pull latest code
            git fetch origin
            git reset --hard "origin/$BRANCH"

            # Install PHP dependencies
            $PHP_PATH $COMPOSER_PATH install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Run database migrations
            $PHP_PATH artisan migrate --force

            # Clear and optimize Laravel caches
            $PHP_PATH artisan config:cache
            $PHP_PATH artisan route:cache
            $PHP_PATH artisan view:cache

            # artisan รันเป็น root → ไฟล์ที่มันสร้างเป็นของ root ทำให้ php-fpm (www-data)
            # เขียน log/cache ไม่ได้ แล้วทุก request กลายเป็น 500
            chown -R www-data:www-data storage bootstrap/cache

            # ยืนยัน invariant ที่เคยพัง — ถ้ายังไม่ถูกต้องให้ deploy แดง ไม่ใช่ปล่อยผ่าน
            for d in storage/logs bootstrap/cache; do
              owner=$(stat -c '%U' "$d")
              if [ "$owner" != "www-data" ]; then
                echo "::error::$d is owned by $owner — php-fpm (www-data) cannot write to it"
                exit 1
              fi
            done

            echo "✅ Linentechpro deployment completed successfully! → $(git rev-parse --short HEAD)"
